<style>
  @page { size: 148mm 210mm; margin: 0; }
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#4a4643;--muted:#8d827b;--accent:#9d7771;--line:rgba(74,70,67,.22);
    --serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",Arial,sans-serif;--script:"Italianno",cursive}
  html,body{width:148mm;height:210mm}
  body{position:relative;overflow:hidden;font-family:var(--sans);color:var(--ink);
    background:linear-gradient(150deg,#f5efe9,#eee5df 52%,#f7f1ec);
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .flit{position:absolute;transform:rotate(var(--r));opacity:.5}
  .flit svg{width:100%;height:auto;display:block}
  .w1{fill:var(--w1);stroke:var(--wd);stroke-width:3;stroke-opacity:.5}
  .w2{fill:var(--w2)} .sp{fill:#fff;opacity:.45}
  .bd{fill:var(--wd)} .an{stroke:var(--wd);stroke-width:5;fill:none;stroke-linecap:round;opacity:.8}
  .card{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:14mm 16mm}
  .mark{width:26mm;height:auto;display:block;margin-bottom:5mm}
  .mark path{fill:#1c1917}
  .hero{width:32mm;height:auto;display:block;margin-bottom:4mm}
  .hero svg{filter:drop-shadow(1.6mm 2mm 1.4mm rgba(74,70,67,.15))}
  .hero .w1{fill:#f0e6dd;stroke:#8f746c;stroke-width:2.4;stroke-opacity:.8}
  .hero .w2{fill:#ddcabf;stroke:#8f746c;stroke-width:2.4;stroke-opacity:.6}
  .hero .bd{fill:#6a5d58}
  .hero .an{stroke:#6a5d58;stroke-width:3.4} .hero .sp{fill:#fff;opacity:.6}
  .micro{font-size:6pt;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
  .rule{width:18mm;height:1px;background:var(--line);margin:3mm auto}
  .script{font-family:var(--script);font-size:26pt;line-height:.7;color:var(--accent);margin-top:1mm}
  h1{font-family:var(--serif);font-weight:400;text-transform:uppercase;letter-spacing:.16em;
    font-size:34pt;line-height:.85;margin:2mm 0 3mm}
  .names{font-family:var(--script);font-size:31pt;color:#6d625e;margin-bottom:3mm}
  .names i{font-family:var(--serif);font-style:normal;font-size:12pt;color:var(--accent)}
  .date{font-size:7pt;letter-spacing:.3em}
  .place{font-size:6pt;letter-spacing:.22em;color:var(--muted);margin-top:1.5mm}
  .foot{position:absolute;left:0;right:0;bottom:11mm;text-align:center;z-index:2}
  .foot .rule{margin-bottom:3mm}
  .foot span{font-size:6.2pt;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .foot b{display:block;margin-top:2mm;font-family:var(--serif);font-size:12pt;
    font-weight:500;letter-spacing:.05em;color:var(--accent)}
</style>
</head>
